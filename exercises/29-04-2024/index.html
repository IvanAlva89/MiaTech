<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <div class="container">
        <div class="item1">1</div>
        <div class="item2">2</div>
        <div class="item3">3</div>
    </div> -->
    <div class="grid-calculator">
        <input 
            class="grid-calculator__number"
            type="text" 
            value="0"
        >
        <div class="grid-calculator__container">
            <div class="grid-item">C</div>
            <div class="grid-item">&larr;</div>
            <div class="grid-item">&percnt;</div>
            <div class="grid-item">&divide;</div>
            <div class="grid-item">7</div>
            <div class="grid-item">8</div>
            <div class="grid-item">9</div>
            <div class="grid-item">&times;</div>
            <div class="grid-item">4</div>
            <div class="grid-item">5</div>
            <div class="grid-item">6</div>
            <div class="grid-item">&minus;</div>
            <div class="grid-item">1</div>
            <div class="grid-item">2</div>
            <div class="grid-item">3</div>
            <div class="grid-item">&plus;</div>
            <div class="grid-item span-2">0</div>
            <div class="grid-item">&comma;</div>
            <div class="grid-item">&equals;</div>
        </div>
    </div>
</body>
</html>
