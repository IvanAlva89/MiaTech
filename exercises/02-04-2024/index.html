<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">

        <p><label for="about">Tell us about you:</label></p>
        <textarea id="about" name="about" rows="3" cols="30">I'm Ivan and I'm learning to become a web developer in 2024 ...</textarea>

        <fieldset>
            <legend>Select your gender:</legend>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
        </fieldset>

        <input type="checkbox" id="privacy" name="privacy" value="privacy" >
        <label for="privacy">I have read and agree Privacy Policy</label>

    </form>
</body>
</html>
