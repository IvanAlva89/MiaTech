    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors : {
                        primary: "#0a829d",
                        secondary: "#94568c",
                        tertiary: "#ffa5ce",
                        link: "red"
                    },
                    padding: {
                        '5px': '5px',
                        '3px': '3px'
                    },
                    margin: {
                        '4px': '4px'
                    },
                    fontSize: {
                        '1xl': '1.5rem',
                        '2xl': '2rem'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .btn {
                border: 1px solid red;
                padding: 10px;
                border-radius: 5px;
            }
            .btn-primary {
                @apply btn text-primary;
            }

            .btn-secondary {
                @apply btn hover:bg-tertiary hover:text-1xl;
            }

            .card {
                @apply border-2 rounded-md border-blue-400;
            }
        }
    </style>
</head>
