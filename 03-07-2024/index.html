<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors : {
                        primary: "#0a829d",
                        secondary: "#94568c",
                        tertiary: "#ffa5ce",
                        link: "red"
                    },
                    padding: {
                        '5px': '5px',
                        '3px': '3px'
                    },
                    margin: {
                        '4px': '4px'
                    },
                    fontSize: {
                        '1xl': '1.5rem',
                        '2xl': '2rem'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .btn {
                border: 1px solid red;
                padding: 10px;
                border-radius: 5px;
            }
            .btn-primary {
                @apply btn text-primary;
            }

            .btn-secondary {
                @apply btn hover:bg-tertiary hover:text-1xl;
            }

            .card {
                @apply border-2 rounded-md border-blue-400;
            }
        }
    </style>
</head>
<body>
    <div class="container mx-auto p-4">
        <button class="btn mx-4">Button 1</button>
        <button class="btn-primary">Button 2</button>
        <button class="btn-secondary mx-4">Button 3</button>
    </div>
    <div class="container mx-auto">
        <div class="card p-3 w-64">
            <h2 class="text- font-medium">Title card</h2>
            <p class="my-2">Lorem ipsum dolor sit amet consectetur.</p>
            <button class="btn">Cliccami</button>
        </div>
    </div>

    <script src="./main.js"></script>

</body>
</html>
