<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors : {
                        primary: "#0a829d",
                        secondary: "#94568c",
                        tertiary: "#ffa5ce",
                        link: "red"
                    },
                    padding: {
                        '5px': '5px',
                        '3px': '3px'
                    },
                    margin: {
                        '4px': '4px'
                    },
                    fontSize: {
                        '1xl': '1.5rem',
                        '2xl': '2rem'
                    }
                }
            }
        }
    </script>
</head>
<body>
    <form class="container mx-auto p-4">
        <div class="my-2">
            <label for="name">Nome:</label>
            <input
                class="border-2 rounded focus:outline-none focus:border-yellow-300"
                type="text" 
                name="name" 
                id="name"
            >
        </div>
        <div class="my-2">
            <label for="surname">Cognome:</label>
            <input
                class="border-2 rounded active:bg-stone-300"
                type="text" 
                name="surname" 
                id="surname"
            >
        </div>
        <div>
            <label for="email">Email:</label>
            <input
                class="border-2 rounded focus:outline-none disabled:opacity-70 disabled:border-lime-200"
                type="text" 
                name="email" 
                id="email"
                disabled
            >
        </div>
        <input
            class="border-2 rounded p-2 disabled:opacity-75 disabled:text-slate-400 my-2"
            type="submit" 
            value="Invia"
            disabled
        >
    </form>

    <script src="./main.js"></script>

</body>
</html>
