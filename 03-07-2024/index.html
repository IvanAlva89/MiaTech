<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors : {
                        primary: "#0a829d",
                        secondary: "#94568c",
                        tertiary: "#ffa5ce",
                        link: "red"
                    },
                    padding: {
                        '5px': '5px',
                        '3px': '3px'
                    },
                    margin: {
                        '4px': '4px'
                    },
                    fontSize: {
                        '1xl': '1.5rem',
                        '2xl': '2rem'
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div class="container mx-auto p-4">
        <button class="rounded-full border-2 border-orange-400 bg-tertiary p-5 hover:border-8">Btn1</button>
        <button class="rounded-md border-2 border-rose-500 p-5 hover:bg-primary">Btn2</button>
        <button class="border-2 border-purple-300 bg-secondary p-5 hover:text-1xl">Btn3</button>
    </div>

    <script src="./main.js"></script>

</body>
</html>
